<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalMarket - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="../assets/img/logo.png">
    <link href="css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand text-warning" href="index.html">GlobalMarket</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item" id="nav-login">
                        <a class="nav-link" href="login.html"><i class="fas fa-sign-in-alt"></i> Entrar</a>
                    </li>
                    <li class="nav-item user-dropdown" id="nav-user" style="display: none;">
                        <button id="user-menu-btn" class="nav-link nav-btn text-white-50">
                            <i class="fas fa-user-circle"></i> Hola, <span id="nombre-usuario">Usuario</span> <i
                                class="fas fa-chevron-down"></i>
                        </button>
                        <div id="dropdown-content" class="dropdown-content">
                            <a href="perfil.html"><i class="fas fa-id-card"></i> Mi Perfil</a>
                            <a href="mis-pedidos.html"><i class="fas fa-box"></i> Mis Pedidos</a>
                            <a href="#" id="btn-cerrar-sesion"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
                        </div>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">📖 Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="carrito.html">🛒Carrito</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow border-0 rounded-3">
                    <div class="card-body p-5">
                        <h3 class="text-center mb-2 fw-bold">Registrate</h3>
                        <p class="text-center text-muted mb-4">Complete sus datos personales para registrarse en la plataforma.</p>
                        
                        <form id="form-registro">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Nombre</label>
                                    <input type="text" id="reg-nombre" class="form-control" placeholder="Escriba su nombre" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Apellidos</label>
                                    <input type="text" id="reg-apellidos" class="form-control" placeholder="Escriba sus apellidos" required>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label fw-semibold">Correo Electrónico</label>
                                    <input type="email" id="reg-email" class="form-control" placeholder="ejemplo@correo.com" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Teléfono</label>
                                    <input type="tel" id="reg-telefono" class="form-control" placeholder="Número de contacto" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Contraseña</label>
                                    <input type="password" id="reg-contrasena" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Dirección de Envío Completa</label>
                                    <textarea id="reg-direccion" class="form-control" rows="3" placeholder="Calle, número, piso, código postal, provincia y ciudad" required></textarea>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                                        <i class="fas fa-user-plus"></i> Completar Registro
                                    </button>
                                </div>
                            </div>
                        </form>
                        
                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="mb-0 text-muted">¿Ya tienes una cuenta activa? <a href="login.html" class="fw-bold text-decoration-none">Iniciar Sesión</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 GlobalMarket. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
