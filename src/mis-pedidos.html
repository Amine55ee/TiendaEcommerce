<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalMarket - Mis Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="../assets/img/logo.png">
    <link href="css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand text-warning" href="index.html">GlobalMarket</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item" id="nav-login">
                        <a class="nav-link" href="login.html"><i class="fas fa-sign-in-alt"></i> Entrar</a>
                    </li>
                    <li class="nav-item user-dropdown" id="nav-user" style="display: none;">
                        <button id="user-menu-btn" class="nav-link nav-btn text-white-50">
                            <i class="fas fa-user-circle"></i> Hola, <span id="nombre-usuario">Usuario</span> <i
                                class="fas fa-chevron-down"></i>
                        </button>
                        <div id="dropdown-content" class="dropdown-content">
                            <a href="perfil.html"><i class="fas fa-id-card"></i> Mi Perfil</a>
                            <a href="mis-pedidos.html"><i class="fas fa-box"></i> Mis Pedidos</a>
                            <a href="#" id="btn-cerrar-sesion"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
                        </div>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">📖 Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="carrito.html">🛒Carrito</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5 flex-grow-1">
        <h2 class="fw-bold text-dark mb-4"><i class="fas fa-box text-success"></i> Mi Historial de Pedidos</h2>
        
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" id="tabla-pedidos">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-4">ID Pedido</th>
                                <th>Fecha</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th class="text-center pe-4">Detalles</th>
                            </tr>
                        </thead>
                        <tbody id="contenedor-pedidos">
                            <tr>
                                <td colspan="5" class="text-center py-4 text-muted">
                                    <i class="fas fa-spinner fa-spin fa-2x mb-2"></i><br>Cargando sus pedidos...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 GlobalMarket. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof cargarHistorialPedidos === 'function') {
                cargarHistorialPedidos();
            }
        });
    </script>
</body>

</html>
