<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalMarket - Panel de Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="shortcut icon" href="../assets/img/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#"><i class="fas fa-shield-alt"></i> Centro de Control ADMIN</a>
            <div class="d-flex">
                <button class="btn btn-outline-light" onclick="cerrarSesionAdmin()">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión y Salir
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3 col-lg-2 mb-4">
                <div class="list-group shadow-sm">
                    <a href="#" class="list-group-item list-group-item-action active bg-danger border-danger">
                        <i class="fas fa-chart-line"></i> Resumen Global
                    </a>
                    <a href="#" class="list-group-item list-group-item-action"><i class="fas fa-box"></i> Gestionar Productos</a>
                    <a href="#" class="list-group-item list-group-item-action"><i class="fas fa-users"></i> Listado de Clientes</a>
                </div>
            </div>

            <div class="col-md-9 col-lg-10">
                <h2 class="mb-4 fw-bold text-dark">Estadísticas de la Tienda</h2>
                
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="card text-white bg-primary shadow-sm h-100 border-0">
                            <div class="card-body">
                                <h6 class="card-title text-uppercase text-white-50 fw-bold">Ingresos Totales</h6>
                                <h2 class="fw-bold mb-0" id="admin-ventas">0.00 €</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-white bg-success shadow-sm h-100 border-0">
                            <div class="card-body">
                                <h6 class="card-title text-uppercase text-white-50 fw-bold">Pedidos Finalizados</h6>
                                <h2 class="fw-bold mb-0" id="admin-pedidos-count">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-white bg-dark shadow-sm h-100 border-0">
                            <div class="card-body">
                                <h6 class="card-title text-uppercase text-white-50 fw-bold">Clientes Registrados</h6>
                                <h2 class="fw-bold mb-0" id="admin-usuarios">0</h2>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold"><i class="fas fa-list text-danger"></i> Últimos Movimientos</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">ID Pedido</th>
                                        <th>Cliente (ID)</th>
                                        <th>Fecha</th>
                                        <th>Total</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-admin-pedidos">
                                    <tr>
                                        <td colspan="5" class="text-center py-5 text-muted">
                                            <i class="fas fa-spinner fa-spin fa-2x mb-3"></i><br>Cargando datos del servidor...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
